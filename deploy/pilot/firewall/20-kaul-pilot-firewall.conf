[Unit]
Wants=network-online.target
Requires=ufw.service
After=network-online.target ufw.service
RequiresMountsFor=/etc/kaul/pilot-firewall.conf /usr/local/libexec/kaul-pilot-firewall
StartLimitIntervalSec=300
StartLimitBurst=1

[Service]
Restart=no
ExecStartPre=/usr/local/libexec/kaul-pilot-firewall preflight --config /etc/kaul/pilot-firewall.conf
ExecStartPre=/usr/local/libexec/kaul-pilot-firewall apply --config /etc/kaul/pilot-firewall.conf
ExecStartPost=/usr/local/libexec/kaul-pilot-firewall verify --config /etc/kaul/pilot-firewall.conf
ExecStopPost=/usr/local/libexec/kaul-pilot-firewall fail-closed --config /etc/kaul/pilot-firewall.conf
