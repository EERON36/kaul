name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backup-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned Restic tools
        run: |
          scripts/install-pinned-restic-ci.sh "$RUNNER_TEMP/kaul-backup-tools"
          printf '%s\n' "$RUNNER_TEMP/kaul-backup-tools" >> "$GITHUB_PATH"

      - name: Rehearse append-only backup and exact restore
        run: scripts/pilot-backup-rehearsal.sh

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAUL_TEST_ID: ci
      KAUL_TEST_PORT: 3101
      DATABASE_URL: postgresql://kaul:ci-development-only@127.0.0.1:5432/kaul_test_ci
      INTEGRATION_DATABASE_URL: postgresql://kaul:ci-development-only@127.0.0.1:5432/kaul_test_ci
      DEPLOYMENT_ENV: test
      BETTER_AUTH_SECRET: fictional-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3101

    services:
      database:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: kaul
          POSTGRES_PASSWORD: ci-development-only
          POSTGRES_DB: kaul_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaul -d kaul_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Run database integration tests
        run: npm run test:integration

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm run audit:ci
