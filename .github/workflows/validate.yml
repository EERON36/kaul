name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  firewall-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Rehearse systemd post-start failure handling
        run: sudo bash scripts/pilot-firewall-systemd-rehearsal.sh

      - name: Rehearse Docker-aware private ingress firewall
        run: bash scripts/pilot-firewall-rehearsal.sh

  ingress-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Rehearse private and future public Caddy ingress
        run: bash scripts/pilot-ingress-rehearsal.sh

  backup-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned Restic tools
        run: |
          scripts/install-pinned-restic-ci.sh "$RUNNER_TEMP/kaul-backup-tools"
          printf '%s\n' "$RUNNER_TEMP/kaul-backup-tools" >> "$GITHUB_PATH"

      - name: Rehearse append-only backup and exact restore
        run: scripts/pilot-backup-rehearsal.sh

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAUL_TEST_ID: ci
      KAUL_TEST_PORT: 3101
      DATABASE_URL: postgresql://kaul:ci-development-only@127.0.0.1:5432/kaul_test_ci
      INTEGRATION_DATABASE_URL: postgresql://kaul:ci-development-only@127.0.0.1:5432/kaul_test_ci
      DEPLOYMENT_ENV: test
      BETTER_AUTH_SECRET: fictional-ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3101
      DOCUMENT_STORAGE_ROOT: ${{ runner.temp }}/kaul-documents-ci
      DOCUMENT_SCANNER_HOST: 127.0.0.1
      DOCUMENT_SCANNER_PORT: 3310
      DOCUMENT_SCANNER_TIMEOUT_MS: 15000
      DOCUMENT_SCAN_MAX_SIGNATURE_AGE_HOURS: 24

    services:
      database:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: kaul
          POSTGRES_PASSWORD: ci-development-only
          POSTGRES_DB: kaul_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaul -d kaul_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      document-scanner:
        image: clamav/clamav:1.4.6@sha256:b25d9199257ae7ef45e0cc4c7eaa60ce7e5447796f0090d5ff311d1a30980cc3
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --security-opt no-new-privileges

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Run database integration tests
        run: npm run test:integration

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm run audit:ci
